<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Glowme Up">
  <meta name="keywords" content="Glowme, beauty, makeup, skincare, cosmetics">
  <meta name="author" content="Glowme Up">
  <meta property="og:title" content="Glowme Up">
  <meta property="og:description" content="Khám phá Glowme Up - nâng tầm phong cách và vẻ đẹp của bạn">
  <meta property="og:image" content="./imgs/glowme_logo.png">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" sizes="180x180" href="./imgs/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./imgs/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./imgs/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="./imgs/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Glow Me Up</title>
</head>
<body>
  <div id="glowme_page" class="glowme_page">
  <div class="glow_wrap">
    <div class="glow_logo">
      <img src="./imgs/glowme_logo.png" alt="">
    </div>
    <h1 class="glowme_title" id="animated-text">LET'S GLOW TOGETHER</h1>
    <h3 id="circle-animation" class="glow_fire_btn">
      <div id="arrow-container">
        <textPath class="start_txt" xlink:href="#textcircle">START</textPath>
      </div>
      <div class="circle-container scroll-circle">
        <svg viewBox="0 0 500 500">
          <defs>
            <path d="M50,250c0-110.5,89.5-200,200-200s200,89.5,200,200s-89.5,200-200,200S50,360.5,50,250" id="textcircle"></path>
          </defs>
          <text dy="30">
            <textPath xlink:href="#textcircle">&nbsp; GLOW ME UP &nbsp; GLOW ME UP &nbsp; GLOW ME UP &nbsp; GLOW ME UP</textPath>
          </text>
        </svg>
      </div>
    </h3>
    <p id="helloText" class="helloText">
      <span class="helloText_bold">THE JOURNEY BEGINS</span>
      </br>
      <span class="glowText">Glow with us from day one</span>
    </p>
  </div>

  <div class="glowme_text_bottom">
    Beauty - Technology - AI
  </div>

  <audio id="fireworksSound" preload="auto">
    <source src="./audio/jim.mp3" type="audio/mpeg" />
  </audio>


  <div id="fwOverlay" class="fwOverlay">
    <dotlottie-wc id="fwAnim"
      src="https://lottie.host/63f454ec-0886-4f3a-b4e1-c92c166e0641/moRXCmAXyq.lottie"
      style="width:100vmin; height:100vmin;scale:1.7"
      speed="1"
      loop="false"
      autoplay="false">
    </dotlottie-wc>
  </div>

  <div id="loader" class="loader">
    <div class="loader-inner" >
      <!-- <div style="font-size:16px; opacity:.8; letter-spacing:.2em; margin-bottom:8px;">LOADING</div> -->
      <div id="count">10</div>
      <!-- <div style="font-size:14px; opacity:.7; margin-top:8px;">seconds</div> -->
    </div>
  </div>
</div>
<script type="module" src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
