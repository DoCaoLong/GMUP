                text-decoration: none;
                transition: background 0.15s ease, transform 0.1s ease;
            }

                overflow: hidden;

            }

            }
            .blog_cover img {
                width: 100%;

                object-fit: cover;

            .blog_content {
                background: #ffffff;

                padding: 24px 20px;
                box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);

            .blog_content p {

            }
            .loading,

                color: #374151;
            }
            .error {
                color: #b91c1c;
            }
            #preloader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0e0e0e;
                z-index: 99999;
                overflow: hidden;
            }

            .line-slice {
                position: absolute;
                top: 50%;
                left: 0;
                transform: translateY(-50%) scaleX(0);
                width: 100vw;
                height: 1px;
                background-color: #fec93f;
                z-index: 99998;
                transform-origin: left center;
            }

            .preloader-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000;
                transform: scaleY(0);
                transform-origin: center;
                z-index: 99997;
            }
            .blog_wrap {
                display: flex;
                gap: 30px;
                margin-bottom: 50px;
            }
            .blog_main {

                margin: 0 auto;
            }
            .blog_main h1 {

                margin-bottom: 20px;
            }
            .header {

            }

                width: 20%;
            } */
            main img {

                height: auto !important;
            }
            .img img {

                height: 100%;
                object-fit: cover;
            }
            p,

            }
            h1 {

                }

                    padding-top: 0;
                }

        <script>
            const API_DETAIL =
                "https://api.myspa.vn/v1/organizations/demozns/news/";
            const API_LIST =
                "https://api.myspa.vn/v1/organizations/demozns/news?filter[status]=true&sort=-created_date";

            function getNewsIdFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get("id");
            }

            function formatDate(dateStr) {
                if (!dateStr) return "";
                const d = new Date(dateStr.replace(" ", "T"));
                if (isNaN(d.getTime())) return dateStr;
                const day = d.getDate();
                const month = d.getMonth() + 1;
                const year = d.getFullYear();
                return `${day}.${month}.${year}`;
            }

            async function loadNewsDetail() {
                const id = getNewsIdFromUrl();
                const titleEl = document.getElementById("newsTitle");
                const dateEl = document.getElementById("newsDate");
                const imgEl = document.getElementById("newsImage");
                const contentEl = document.getElementById("newsContent");

                try {
                    const res = await fetch(API_DETAIL + id);
                    if (!res.ok) throw new Error("Network error");

                    const json = await res.json();
                    const data = json.context;

                    if (!data || data.deleted === 1 || data.status === false) {
                        titleEl.textContent = "Bài viết không tồn tại";
                        dateEl.textContent = "";
                        contentEl.innerHTML =
                            '<p class="error">Bài viết đã bị xóa hoặc tạm ẩn.</p>';
                        return;
                    }

                    titleEl.textContent = data.title || "Chi tiết bài viết";
                    dateEl.textContent = formatDate(data.created_date);

                    if (data.image_url) {
                        imgEl.src = data.image_url;
                        imgEl.alt = data.title || "GlowMeUp News";
                    }

                    contentEl.innerHTML = data.content || "";
                } catch (err) {
                    console.error(err);
                    titleEl.textContent = "Có lỗi xảy ra";
                    dateEl.textContent = "";
                    contentEl.innerHTML =
                        '<p class="error">Không thể tải nội dung bài viết, vui lòng thử lại sau.</p>';
                }
            }

            async function loadSidebarPosts() {
                const currentId = getNewsIdFromUrl();
                const sidebar = document.getElementById("sidebarList");

                try {
                    const res = await fetch(API_LIST);
                    if (!res.ok) throw new Error("Network error");

                    const json = await res.json();
                    const list = (json.context && json.context.data) || [];
                    console.log("list :>> ", list);

                    const filtered = list
                        .filter((item) => String(item.id) !== String(currentId))
                        .slice(0, 5); // hiển thị tối đa 5 bài

                    if (!filtered.length) {
                        sidebar.innerHTML =
                            '<p class="loading">Chưa có bài viết khác.</p>';
                        return;
                    }

                    sidebar.innerHTML = filtered
                        .map((item) => {
                            const date = formatDate(item.created_date);
                            const url = `/blog-news.html?id=${item.id}`;
                            return `
                                <a href="${url}" class="sidebar_item">
                                    <div class="sidebar_item_title">
                                        ${item.title}
                                    </div>
                                    <div class="sidebar_item_meta">
                                        <span>${date}</span>
                                    </div>
                                </a>
                            `;
                        })
                        .join("");
                } catch (err) {
                    console.error(err);
                    sidebar.innerHTML =
                        '<p class="error">Không thể tải danh sách bài viết khác.</p>';
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                loadNewsDetail();
                loadSidebarPosts();
            });
        </script>
